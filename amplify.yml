version: 1
frontend:
  phases:
    preBuild:
      commands:
        - "npm ci --legacy-peer-deps --cache .npm --prefer-offline"
    build:
      commands:
        - "npm run build"
        - echo "VITE_BACKEND_URL=$VITE_BACKEND_URL" >> .env
  artifacts:
    baseDirectory: dist/client
    files:
      - "**/*"
  cache:
    paths:
      - ".npm/**/*"
